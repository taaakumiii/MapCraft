name: Build Windows distribution
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python scripts/bootstrap_runtime.py
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --noconfirm MapCraft.spec
      - run: python scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: MapCraft-Windows
          path: release/*.zip
          retention-days: 30
