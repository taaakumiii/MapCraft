name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.0.0 amulet-leveldb==1.0.7 amulet-nbt==2.1.6 numpy==1.26.4 shapely==2.1.2
      - run: python -m unittest discover -s tests -v
